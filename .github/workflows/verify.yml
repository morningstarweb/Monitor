name: Verify (free public runners)

# CHECKS ONLY. This workflow does not deploy, publish, sign, create releases, or
# reference any repository secret. It is therefore safe to run on pull requests
# from forks. All third-party actions are pinned to immutable commit SHAs.
# Refresh the pinned SHAs deliberately after reviewing upstream changes.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # gitleaks 8.28.0 linux_x64 tarball, SHA-256 verified below (hash pin).
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  secret-scan:
    name: Secret scan (working tree + full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install hash-pinned gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree and history (redacted; fail closed)
        shell: bash
        run: |
          set -uo pipefail
          # Reports are JSON and gitleaks runs with --redact: no secret values
          # are written to CI logs. Only exit codes and counts are printed.
          gitleaks dir . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path /tmp/gitleaks-worktree.json
          wt=$?
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --log-opts=--all --report-format json --report-path /tmp/gitleaks-history.json
          ht=$?
          python3 - <<'PY'
          import json
          for label, path in (("worktree", "/tmp/gitleaks-worktree.json"),
                              ("history", "/tmp/gitleaks-history.json")):
              try:
                  with open(path, encoding="utf-8") as handle:
                      findings = json.load(handle)
                  print(f"gitleaks {label}: findings={len(findings)} (values redacted)")
              except FileNotFoundError:
                  print(f"gitleaks {label}: no report produced")
          PY
          if [ "$wt" -ne 0 ] || [ "$ht" -ne 0 ]; then
            echo "::error::Secret scan failed closed (worktree exit=$wt, history exit=$ht). No values printed."
            exit 1
          fi

  rust-checks:
    name: Rust format / check / clippy / test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        # Pinned commit for the dtolnay/rust-toolchain "stable" branch tip.
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workspace typecheck
        run: cargo check --workspace --all-targets --locked
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked

  python-e2e:
    name: Python contract and e2e checks (mock-based)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run e2e runner
        run: python tests/e2e/runner.py
      - name: Run adversarial contract suite
        run: python tests/test_empirical_m3_adversarial.py

  inventory-and-audit:
    name: SBOM generation + informational dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Generate CycloneDX-ish SBOM (no network)
        run: python scripts/generate_sbom.py --allow-missing --out monitor-sbom.json

      - name: Check SBOM accounting
        run: |
          python3 - <<'PY'
          import json
          with open("monitor-sbom.json", encoding="utf-8") as handle:
              sbom = json.load(handle)
          props = {p["name"]: p["value"] for p in sbom["metadata"]["properties"]}
          total = int(props["monitor:componentsTotal"])
          known = int(props["monitor:licensesKnownFromLockfile"])
          unknown = int(props["monitor:licensesUnknown"])
          assert total == len(sbom["components"]), "component count mismatch"
          assert known + unknown == total, "license accounting mismatch"
          print(f"SBOM components={total} known={known} UNKNOWN={unknown} (informational only)")
          PY

      # Advisory data changes constantly. These steps are INFORMATIONAL ONLY:
      # unknown advisories do not fail the build; a human must review them.
      - name: Rust advisory audit (informational)
        continue-on-error: true
        run: |
          if command -v cargo-audit >/dev/null 2>&1; then
            cargo audit --json > cargo-audit.json || true
            echo "cargo-audit output saved locally (informational; not uploaded or failed on)."
          else
            echo "cargo-audit is not installed: Rust advisory audit NOT RUN. Human review required."
          fi
