name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.28.0"
          SHA256="a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan tracked content and history
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml --redact --no-banner
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts=--all

  rust-checks:
    name: Rust Workspace Checks & Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter (Zero Warnings Allowed)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Test Suite
        run: cargo test --workspace --all-targets --locked

  android-checks:
    name: Android Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Debug Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Release Unit Tests
        run: ./gradlew testReleaseUnitTest

      - name: Run Debug Lint
        run: ./gradlew lintDebug

      - name: Run Release Lint
        run: ./gradlew lintRelease

  e2e-checks:
    name: Automated Architecture & Adversarial Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run E2E Verification Suite
        run: python tests/e2e/runner.py

      - name: Run Empirical M3 Adversarial Suite
        run: python tests/test_empirical_m3_adversarial.py

      - name: Run Scalability Concurrency Stress Suite
        run: python tests/e2e/test_scalability_concurrency_stress.py

