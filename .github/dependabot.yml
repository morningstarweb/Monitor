version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Cargo (Rust Workspace)
  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: "weekly"

  # Maintain dependencies for Gradle (Android App)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm (Cloudflare Worker)
  - package-ecosystem: "npm"
    directory: "/cloud"
    schedule:
      interval: "weekly"
